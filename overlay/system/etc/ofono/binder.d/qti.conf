# ofono-binder-plugin configuration -- Xiaomi Mi A3 (laurel_sprout), Halium 11.
#
# Read by ofono's binder plugin, which is what replaces the old rilmodem
# transport on Halium 9+. On Android 11 there is no /dev/socket/rild any more:
# the modem is behind the IRadio HIDL HAL, reached over binder. Selecting the
# plugin is done in the deviceinfo yaml (OfonoPlugin: binder); this file
# describes the slots behind it.
#
# Copied from the fairphone-fp4 reference port (same Halium 11, same QTI
# extPlugin) with only the header changed.
#
# radioInterface = 1.4 is android.hardware.radio@1.4::IRadio, the interface
# ofono-binder-plugin tops out at. Confirm the vendor actually publishes it
# before blaming this file for a dead modem:
#
#     lxc-attach -n android -- /system/bin/lshal | grep android.hardware.radio
#
# ExpectSlots lists both slots because the Mi A3 is dual-SIM; which of them
# ofono actually brings up is decided in ril_subscription.conf next to this
# file.
[Settings]
ExpectSlots = slot1,slot2
extPlugin = qti
radioInterface = 1.4

[slot1]
path = /ril_0
slot = 0

[slot2]
path = /ril_1
slot = 1
