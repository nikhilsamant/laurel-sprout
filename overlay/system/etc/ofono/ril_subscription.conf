# ofono modem configuration -- Xiaomi Mi A3 (laurel_sprout), Halium 11.
#
# Copied from the fairphone-fp4 reference port. The [ril_N] sections name the
# modems ofono creates and bind them to the binder slots declared in
# binder.d/qti.conf.
#
# Both slots are enabled. [ril_1] was previously commented out pending proof
# that the vendor HAL actually serves slot 2 -- bringing up a slot it does not
# serve makes ofono retry it forever. That proof is now on record (2026-09-06):
#
#   - /android/vendor/etc/vintf/manifest.xml declares android.hardware.radio
#     @1.4::IRadio/slot1 AND @1.4::IRadio/slot2, so the HAL serves both.
#   - binder.d/qti.conf has always said ExpectSlots = slot1,slot2, and ofono
#     already creates /ril_1 from it: on device /ril_1 reads Online=true,
#     Powered=true with SimManager Present=false. An empty slot, handled
#     cleanly, with no retry loop in the ofono journal.
#   - Both dual-SIM Halium 11 reference ports declare both slots:
#     nothing-phone-1/nothing-spacewar and fairphone-fp5.
#
# This aligns the two config files with each other and with those ports. It is
# a consistency fix, not a power fix -- do not expect it to move standby drain.
#
# NB: radioInterface stays at 1.4 in binder.d/qti.conf. fp5 and spacewar use
# 1.5, but the manifest above shows this hardware implements 1.4. Do not copy
# that value across.
[Settings]
#EmptyConfig=false
#Identity=radio:radio
#3GLTEHandover=true
#SetRadioCapability=auto

SetRadioCapability=off
emptyPinQuery=false
radioPowerCycle=false
confirmRadioPowerOn=false

[ril_0]
transport=binder:name=slot1
name=slot1

[ril_1]
transport=binder:name=slot2
name=slot2
