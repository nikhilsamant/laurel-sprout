# libgbinder configuration -- Xiaomi Mi A3 (laurel_sprout), Halium 11.
#
# Every host-side process that talks to the Android container over binder goes
# through libgbinder: ofono-binder-plugin, bluebinder, the pulseaudio droid
# modules, dummy_cacert, and so on. Android changes the low-level RPC and
# service-manager protocols between releases, so libgbinder has to be told which
# variant to speak.
#
# Without this file libgbinder falls back to its compiled-in default, which is
# the "aidl" (pre-Android-9) variant for both /dev/binder and /dev/vndbinder:
#
#     [Protocol]        [ServiceManager]
#     Default = aidl    Default = aidl
#     /dev/binder = aidl        /dev/binder = aidl
#     /dev/hwbinder = hidl      /dev/hwbinder = hidl
#
# Android 11 (API level 30) needs "aidl3" on /dev/binder and /dev/vndbinder for
# both the protocol and the service manager -- see the API-level presets in
# libgbinder src/gbinder_config.c. ApiLevel picks that preset, which is what
# every UBports Halium 11 reference port ships:
#
#     fairphone-fp4  ApiLevel = 30   (Halium 11)
#     fairphone-fp5  ApiLevel = 30   (Halium 11)
#     volla-mimameid ApiLevel = 32   (Halium 12)
#
# NOTE: this is a plain overlay-store bind mount, so /etc/gbinder.conf must
# already exist on the base rootfs or it is silently skipped. Verify on device
# with "cat /etc/gbinder.conf"; if it still shows the stock content, add a
# .halium-overlay-dir marker beside it (see the README overlay-store section).
[General]
ApiLevel = 30
