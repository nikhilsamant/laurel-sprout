# Device config for Xiaomi Mi A3 (laurel_sprout), read by libdeviceinfo.
# ro.product.device is the GSI name (halium_arm64); the real codename is in
# ro.product.vendor.device, so both are listed under Names.
LAUREL_SPROUT:
  Names:
    - laurel_sprout
    - LAUREL_SPROUT
    - halium_arm64
    - Mi A3
    - Xiaomi Mi A3

  PrettyName: Xiaomi Mi A3
  DeviceType: phone
  # 720x1560 panel; the Halium 9 port used GRID_UNIT_PX=15.
  GridUnit: 15
  SupportedOrientations:
    - Portrait
    - InvertedPortrait
    - Landscape
    - InvertedLandscape

  # Subsystem selection, as the Halium 11 reference ports (fairphone-fp4/fp5).
  # OfonoPlugin selects ofono's binder plugin (Android 11 has no /dev/socket/rild).
  OfonoPlugin: binder
  OfonoImplementsIms: true
  FilesystemEncryption: true

  # Waterdrop notch, top centre. Physical px on the 720x1560 panel. Avoidance
  # areas only on the collapsed bar; a centre cutout splits the row in two, so
  # the expanded row is left as one run. Geometry from the LineageOS framework
  # overlay; see DEVELOPMENT.md. Nothing on the current image reads these yet.
  CollapsedPanelHeight: 60
  DisplayCutoutsCollapsed:
    - 0 0 30 60
    - 300 0 120 60
    - 690 0 30 60
