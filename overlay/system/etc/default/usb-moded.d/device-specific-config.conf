# usb-moded environment for Xiaomi Mi A3 (laurel_sprout).
#
# Overlays the stock /etc/default/usb-moded.d/device-specific-config.conf, whose
# every line is commented out. usb-moded.service reads this via
# "EnvironmentFile=-/etc/default/usb-moded.d/*.conf", and the values are consumed
# by /usr/libexec/ubports-usb-moded-configurator, which envsubst's them into
# /run/ubports-usb-moded-conf/.
#
# Without this the configurator falls back to the pid.codes test IDs
# (IDVENDOR=1209, IDPRODUCT_*=0002..0005) that it ships as placeholders --
# confirmed on-device, /run/ubports-usb-moded-conf/20-ubports-autodetected.ini
# read "idVendor = 1209". Those are documented as "one must properly set these
# values before a port is considered done": hosts key their driver binding and
# their remembered-device state off VID:PID, so a device that enumerates under a
# test ID is at best unrecognised on Windows and at worst re-prompts on every
# mode change.
#
# 05C6 is Qualcomm's vendor ID and the product IDs are QTI's standard composition
# numbers -- the same set the fairphone-fp4 reference port uses
# (overlay/system/etc/default/usb-moded.d/device-specific-config.conf), which is
# correct here for the same reason it is correct there: both are QTI platforms
# using QTI's compositions. The device's own
# /android/vendor/etc/init/hw/init.qcom.usb.rc agrees on the vendor ID, writing
# "idVendor 05C6" for every composition it defines.
IDVENDOR=05C6
IDPRODUCT_MTP=901B
IDPRODUCT_MTP_ADB=903A
IDPRODUCT_RNDIS=F00E
IDPRODUCT_RNDIS_ADB=9024

# MANUFACTURER and PRODUCT are deliberately left unset: the configurator reads
# them from ro.product.vendor.{manufacturer,model}, which on this device already
# return "Xiaomi" and "Mi A3".

# NB: usb-moded's rescue mode (-r, from Environment=USB_MODED_ARGS=-r in the
# stock unit) is deliberately NOT disabled here. The fairphone-fp4 port sets
# USB_MODED_ARGS="" and the stock file's own comment qualifies that with "Only do
# this if you're sure your device will boot" -- rescue mode is what forces
# developer_mode (USB networking on 10.15.19.82) early in boot regardless of the
# saved mode, and it is the only way back in if a mode change ever leaves the
# gadget unusable.
