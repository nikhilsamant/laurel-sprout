# usb-moded USB IDs (QTI standard compositions, as fairphone-fp4).
# MANUFACTURER/PRODUCT are left unset: the configurator reads them from
# ro.product.vendor.{manufacturer,model} ("Xiaomi" / "Mi A3").
IDVENDOR=05C6
IDPRODUCT_MTP=901B
IDPRODUCT_MTP_ADB=903A
IDPRODUCT_RNDIS=F00E
IDPRODUCT_RNDIS_ADB=9024

# Rescue mode off: with the cable attached at boot, -r pins developer_mode
# (rndis only, no adbd) until the cable is unplugged. See DEVELOPMENT.md.
USB_MODED_ARGS=""
