# Default USB mode. rndis_adb is the only stock mode with both a network
# function and adb. This is only the default; /var/lib/usb-moded/usb-moded.ini
# (on userdata) wins once a mode has been saved. See DEVELOPMENT.md.
[usbmode]
mode = rndis_adb

# f_mtp is single-instance and Android init creates g1/functions/mtp.gs0, so the
# stock mtp.mtp mkdir fails with EBUSY. Reuse init's instance; whichever side
# runs second finds it already there. See DEVELOPMENT.md.
[configfs]
function_mtp = mtp.gs0
