# usb-moded mode selection for Xiaomi Mi A3 (laurel_sprout).
#
# Overlays the stock /etc/usb-moded/90-device-specific-config.ini, which ships as
# a single comment line: "Porters: overlay this file if more complex
# configuration beyond auto-detection is needed."
#
# --- What this fixes ---------------------------------------------------------
#
# The stock default is "mode=mtp" (/etc/usb-moded/10-ubports-defaults.ini), which
# carries neither adb nor a network function. What actually kept this port
# reachable was usb-moded's rescue mode: the unit ships
# Environment=USB_MODED_ARGS=-r, and -r forces the developer_mode profile at boot
# regardless of the saved mode. developer_mode sets network = 1 with
# network_interface = usb0, so usb-moded assigns 10.15.19.82 itself, and its
# appsync entries start usb-moded-udhcpd.service and usb-moded-ssh.service
# (sshd bound to 10.15.19.82:8022).
#
# Rescue mode ends when usb-moded reaches init_done, which on this device is
# roughly seven minutes into the boot. usb-moded then applies the saved mode and
# both halves of the connection disappear at once -- the network function is
# dropped and sshd is stopped with it. Measured on a real boot:
#
#   [   13.5s] configfs-gadget gadget: high-speed config #1: c
#   [   13.8s] IPv6: ADDRCONF(NETDEV_CHANGE): usb0: link becomes ready
#   [  414.8s] android_work: sent uevent USB_STATE=DISCONNECTED
#   [  415.0s] android_work: sent uevent USB_STATE=CONFIGURED
#
# and /var/lib/usb-moded/usb-moded.ini was rewritten at that same moment to
# "mode=charging_only_adb". After that usb0 is DOWN (it keeps the stale address,
# which is why "ip addr" still looks plausible) and there is nothing on 8022.
#
# charging_only_adb does include ffs.adb, so adb is nominally present -- but the
# transition re-enumerates the gadget under a different idProduct and the host
# does not re-attach, which is why adb only comes back after toggling Developer
# Mode off and on again to force a fresh mode request.
#
# rndis_adb is the mode that carries both: "sysfs_value = rndis,adb", idProduct
# 9024, with appsync entries for adbd.service and usb-moded-tethering.service.
# Setting it here makes it the default for a fresh install.
[usbmode]
mode = rndis_adb

# NB: this is the *default*. usb-moded's own writable settings file,
# /var/lib/usb-moded/usb-moded.ini, takes precedence and lives on userdata, so it
# survives reflashing the rootfs. On a device that has already saved
# charging_only_adb, delete that file (or pick the mode once in the UI) for this
# default to take effect.
