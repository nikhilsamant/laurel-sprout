# Unbind the configfs gadget from its UDC before ubports-usb-moded-configurator
# runs -- Android init binds it first and a bound gadget rejects new configs
# with EBUSY, which aborts the configurator and leaves the device with no
# usable gadget. Additive drop-in (the dir has a .halium-overlay-dir marker).
# The 00- prefix must sort before ubports-usb-moded-configurator.conf; the empty
# ExecStartPre= resets the list so it stays [unbind, configurator]. See
# DEVELOPMENT.md.
[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c 'UDC=/sys/kernel/config/usb_gadget/g1/UDC; [ -e "$UDC" ] && [ -s "$UDC" ] && echo "" > "$UDC"; exit 0'
