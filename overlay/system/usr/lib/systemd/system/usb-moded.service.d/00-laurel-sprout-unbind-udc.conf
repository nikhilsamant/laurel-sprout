# Unbind the configfs gadget before usb-moded configures it -- Xiaomi Mi A3.
#
# Android init owns the configfs gadget first and we cannot reorder around it:
# lxc-android-config.service is DefaultDependencies=no with
# "Before=systemd-udev-trigger.service sysinit.target", while usb-moded is
# After=local-fs.target/systemd-udev-settle and WantedBy=basic.target. Android
# init therefore always runs first, and adding Before=lxc-android-config.service
# to usb-moded would create an ordering cycle that systemd breaks by silently
# dropping edges.
#
# init.qcom.usb.rc ("on boot") creates g1 with configs/b.1, then
# "setprop sys.usb.config mass_storage" fires an on-property trigger in
# init.msm.usb.configfs.rc which writes sys.usb.controller to g1/UDC. A gadget
# bound to a UDC rejects new configs with EBUSY, so
# /usr/libexec/ubports-usb-moded-configurator dies on
#   mkdir -p /sys/kernel/config/usb_gadget/g1/configs/c.1
# and because that script is "#!/bin/sh -eu" the EBUSY aborts it. ExecStartPre
# fails, usb-moded restarts 5x, systemd gives up, and the device boots with no
# usable gadget at all: no RNDIS, no adb, no SSH over USB. Recovery is then the
# only way in.
#
# Unbinding first lets usb-moded take ownership, which is what it expects on
# Ubuntu Touch. Android init's own mkdir attempts then fail harmlessly with
# EBUSY -- that is the normal, working state (a good boot logs
# "configfs-gadget gadget: high-speed config #1: c", i.e. usb-moded's c.1).
# Harmless when nothing is bound.
#
# --- Why this file is shaped the way it is ------------------------------------
#
# This is an ADDITIVE drop-in living beside the stock
# ubports-usb-moded-configurator.conf rather than replacing it, which is
# possible because overlay/system/usr/lib/systemd/system/ carries a
# .halium-overlay-dir marker: the overlay store merges that directory with
# overlayfs instead of bind-mounting over pre-existing files. The stock drop-in
# therefore still supplies its own "After=sys-kernel-config.mount" and its
# "ExecStartPre=/usr/libexec/ubports-usb-moded-configurator", and neither is
# duplicated here any more.
#
# The 00- prefix is load-bearing. systemd applies drop-ins in lexicographic
# order and ExecStartPre is a list that accumulates, so this file must sort
# before "ubports-usb-moded-configurator.conf" for the unbind to run before the
# configurator. '0' (0x30) < 'u' (0x75), so it does.
#
# The empty "ExecStartPre=" is kept deliberately: it resets the list at this
# point, exactly as the previous replacing version of this config did, so the
# resulting command list stays [unbind, configurator] and nothing inherited from
# the main unit sneaks in ahead of the unbind.
#
# Verify with: systemctl cat usb-moded.service
[Service]
ExecStartPre=
ExecStartPre=/bin/sh -c 'UDC=/sys/kernel/config/usb_gadget/g1/UDC; [ -e "$UDC" ] && [ -s "$UDC" ] && echo "" > "$UDC"; exit 0'
