# adbd sends READY=1 before its USB thread writes the FunctionFS descriptors,
# and usb-moded binds the gadget UDC as soon as adbd.service is active. Binding
# an unready ffs function fails with ENODEV (f_fs.c ffs_do_functionfs_bind), so
# the mode falls back to charging_only. Hold activation until ep1 exists; the
# kernel creates it together with desc_ready. See DEVELOPMENT.md.
[Service]
ExecStartPost=/bin/sh -c 'for i in $(seq 50); do [ -e /dev/usb-ffs/adb/ep1 ] && { sleep 0.1; exit 0; }; sleep 0.1; done; exit 0'
