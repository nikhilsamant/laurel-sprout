# Order lightdm after device-hacks -- Xiaomi Mi A3 (laurel_sprout).
#
# lomiri-system-compositor needs IComposer registered before it starts, or it
# waits and lightdm exits 1 on a 60s timeout. device-hacks brings the composer
# up (see /usr/libexec/lxc-android-config/device-hacks), so lightdm must follow
# it.
#
# This is an ADDITIVE drop-in: it does not touch the stock
# ubuntu-touch-session.conf next to it, which keeps supplying
# OOMScoreAdjust=-1000. That works because
# overlay/system/usr/lib/systemd/system/ carries a .halium-overlay-dir marker,
# so the overlay store merges the directory with overlayfs instead of
# bind-mounting individual files over existing targets. Same mechanism the
# fairphone-fp4 reference port uses to drop dummy_cacert.service into this
# directory.
#
# Drop-in order does not matter here -- After=/Wants= are additive sets, not
# last-one-wins settings.
#
# Verify with: systemctl cat lightdm.service
[Unit]
After=device-hacks.service
Wants=device-hacks.service
