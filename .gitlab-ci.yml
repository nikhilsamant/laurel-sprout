# Shared GSI-port pipeline (build + flashable + devel-flashable).
# https://gitlab.com/ubports/porting/community-ports/halium-generic-adaptation-build-tools/-/blob/main/gsi-port-ci.yml
include:
  - https://gitlab.com/ubports/porting/community-ports/halium-generic-adaptation-build-tools/-/raw/main/gsi-port-ci.yml

variables:
  ADAPTATION_TOOLS_BRANCH: main
  # Run ./build.sh (repo wrapper) instead of ./build/build.sh: it seeds the
  # clang toolchain with `ld` before the kernel build (see build.sh).
  ADAPTATION_TOOLS_USE_BUILD_WRAPPER: "1"
  ADAPTATION_TOOLS_USE_TMP_BUILD_DIR: "1"
  DEV_TARBALL_VARIANT: _usrmerge
  ROOTFS_URL: "https://ci.ubports.com/job/ubuntu-touch-rootfs/job/ubports%252F24.04-1.x/lastSuccessfulBuild/artifact/ubuntu-touch-android9plus-rootfs-arm64.tar.gz"
  OTA_CHANNEL: "24.04-1.x/arm64/android9plus/daily"

image: ubuntu:22.04

build:
  script:
    - apt update
    - >-
      apt install -y --no-install-recommends
      android-tools-mkbootimg bc bison build-essential ca-certificates cpio curl
      fakeroot flex git kmod libelf-dev libssl-dev libtinfo5 lz4 python2 python3
      sudo unzip wget xz-utils
    - ln -sf python2 /usr/bin/python
    - >-
      git clone -b $ADAPTATION_TOOLS_BRANCH
      https://gitlab.com/ubports/porting/community-ports/halium-generic-adaptation-build-tools.git
      build
    - '[ -z "$ADAPTATION_TOOLS_USE_BUILD_WRAPPER" ] && ./build/build.sh || ./build.sh'
